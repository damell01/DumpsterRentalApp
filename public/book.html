<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    .page-hero{padding:90px 0 40px;position:relative;overflow:hidden;background:linear-gradient(160deg,#080808 0%,#100800 60%,#0d0d0d 100%);}
    .page-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 80% at 80% 50%,rgba(249,115,22,.1) 0%,transparent 65%);}
    .page-hero-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);background-size:50px 50px;}
    .breadcrumb-wrap{font-family:var(--font-cond);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gray);margin-bottom:1.5rem;}
    .breadcrumb-wrap a{color:var(--orange);text-decoration:none;}
    .booking-embed-wrap{padding:2.5rem 0 4rem;}
    .booking-embed-card{background:var(--white);color:#111;border-radius:var(--radius-xl);padding:1.5rem;min-height:420px;box-shadow:var(--shadow-orange);}
    @media(max-width:575px){.booking-embed-card{padding:.75rem;border-radius:var(--radius);}}
  </style>
</head>
<body>
<div id="nav-placeholder"></div>
<div id="ticker-placeholder"></div>

<section class="page-hero">
  <div class="page-hero-grid"></div>
  <div class="container position-relative" style="max-width:1300px;">

    <div class="s-label mb-3"><span class="glow-dot"></span><span>Reserve Your Dumpster</span></div>
    <h1 class="display-xl mb-3">BOOK <span class="text-orange">ONLINE</span></h1>
    <div class="orange-line"></div>
    <p class="body-lead" style="max-width:640px;">Pick your size and dates below. Questions first? Give us a call at <a href="tel:+12513334444" class="text-orange" style="text-decoration:none;">(251) 333-4444</a>.</p>
  </div>
</section>

<section class="booking-embed-wrap">
  <div class="container" style="max-width:1100px;">
    <div class="booking-embed-card">
      <div data-drs-booking></div>
    </div>
  </div>
</section>

<div id="footer-placeholder"></div>
